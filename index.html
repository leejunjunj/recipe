<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Recipe Book🍳</title>

  <!-- PWA & Apple Touch Icon 설정 -->
  <meta name="theme-color" content="#fff0f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Recipe Book" />
  <link rel="apple-touch-icon" href="https://fav.farm/🍳" />
  <link rel="icon" href="https://fav.farm/🍳" />

  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Gowun Dodum"', 'sans-serif'],
          },
          colors: {
            appbg: '#fff0f5', // 연한 핑크 배경색
            pinkcard: '#ffffff',
            softgreen: '#88d49e',
            softred: '#f28b82',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDK (v10 Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config (공용 데모 DB)
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyForPublicRecipeBookApp2026",
      authDomain: "recipe-book-app-shared.firebaseapp.com",
      projectId: "recipe-book-app-shared",
      storageBucket: "recipe-book-app-shared.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef1234567890"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.firestoreTools = { collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp };
  </script>

  <style>
    body {
      background-color: #fff0f5;
      font-family: 'Gowun Dodum', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #fbcfe8;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center pb-12">

  <!-- 상단 헤더 -->
  <header class="w-full max-w-2xl bg-white/80 backdrop-blur-md sticky top-0 z-30 px-4 py-3 border-b border-pink-100 flex items-center justify-between shadow-sm">
    <button id="openMenuBtn" class="p-2 text-gray-700 hover:bg-pink-50 rounded-lg transition">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
    <h1 class="text-xl md:text-2xl font-bold text-pink-600 tracking-wide flex items-center gap-1">
      Recipe Book🍳
    </h1>
    <div class="w-8"></div>
  </header>

  <!-- 슬라이드 메뉴 덮개 (Backdrop) -->
  <div id="menuBackdrop" class="fixed inset-0 bg-black/40 z-40 hidden transition-opacity"></div>

  <!-- 사이드 슬라이드 메뉴 -->
  <aside id="sideMenu" class="fixed top-0 left-0 w-72 h-full bg-white z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between shadow-2xl">
    <div class="p-5">
      <div class="flex items-center justify-between pb-4 border-b border-pink-100">
        <span class="font-bold text-lg text-pink-600">메뉴</span>
        <button id="closeMenuBtn" class="p-1 text-gray-500 hover:bg-gray-100 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <nav class="mt-6 space-y-2">
        <button id="navAll" class="menu-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-pink-600 bg-pink-50 transition">
          <i data-lucide="book-open" class="w-5 h-5"></i> 전체 레시피
        </button>
        <button id="navMy" class="menu-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-gray-600 hover:bg-pink-50 hover:text-pink-600 transition">
          <i data-lucide="user" class="w-5 h-5"></i> 내 레시피
        </button>
        <button id="navStarred" class="menu-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-gray-600 hover:bg-pink-50 hover:text-pink-600 transition">
          <i data-lucide="star" class="w-5 h-5"></i> 별표한 레시피
        </button>
        <button id="navCreate" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-emerald-600 bg-emerald-50 hover:bg-emerald-100 transition mt-4">
          <i data-lucide="plus-circle" class="w-5 h-5"></i> 레시피 작성
        </button>
      </nav>
    </div>

    <!-- 메뉴 하단 프로필 설정 -->
    <div class="p-5 border-t border-pink-100 bg-pink-50/50">
      <button id="openProfileModalBtn" class="w-full flex items-center gap-3 p-2 rounded-xl hover:bg-white transition">
        <div id="sideProfileAvatar" class="w-10 h-10 rounded-full bg-pink-200 flex items-center justify-center text-xl overflow-hidden border border-pink-300">
          🍳
        </div>
        <div class="text-left overflow-hidden">
          <p id="sideProfileName" class="font-bold text-sm truncate text-gray-800">요리사</p>
          <p class="text-xs text-pink-500">프로필 설정</p>
        </div>
      </button>
    </div>
  </aside>

  <!-- 메인 컨텐츠 영역 -->
  <main class="w-full max-w-2xl px-4 py-4 flex-1">

    <!-- 검색 & 필터 영역 -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-pink-100 mb-6 space-y-3">
      <!-- AI 검색창 -->
      <div class="relative">
        <input type="text" id="searchInput" placeholder="검색어 입력 (오타도 AI가 자동 이해해요)" class="w-full pl-10 pr-20 py-2.5 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm bg-pink-50/30">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3.5 text-pink-400"></i>
        <button id="aiSearchBtn" class="absolute right-1.5 top-1.5 px-3 py-1.5 bg-pink-500 text-white rounded-lg text-xs font-medium hover:bg-pink-600 transition flex items-center gap-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> AI 검색
        </button>
      </div>

      <!-- 카테고리 필터 버튼 그룹 -->
      <div class="space-y-2 pt-1">
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs custom-scrollbar">
          <span class="font-bold text-gray-400 min-w-max mr-1">종류:</span>
          <button class="filter-btn cat1 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-pink-500 text-white" data-group="1" data-value="전체">전체</button>
          <button class="filter-btn cat1 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="1" data-value="밥">밥</button>
          <button class="filter-btn cat1 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="1" data-value="면">면</button>
          <button class="filter-btn cat1 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="1" data-value="빵">빵</button>
          <button class="filter-btn cat1 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="1" data-value="음료">음료</button>
          <button class="filter-btn cat1 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="1" data-value="디저트">디저트</button>
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs custom-scrollbar">
          <span class="font-bold text-gray-400 min-w-max mr-1">상황:</span>
          <button class="filter-btn cat2 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-pink-500 text-white" data-group="2" data-value="전체">전체</button>
          <button class="filter-btn cat2 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="2" data-value="브런치">브런치</button>
          <button class="filter-btn cat2 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="2" data-value="식사">식사</button>
          <button class="filter-btn cat2 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="2" data-value="간식">간식</button>
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs custom-scrollbar">
          <span class="font-bold text-gray-400 min-w-max mr-1">재료:</span>
          <button class="filter-btn cat3 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-pink-500 text-white" data-group="3" data-value="전체">전체</button>
          <button class="filter-btn cat3 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="3" data-value="소">소</button>
          <button class="filter-btn cat3 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="3" data-value="닭">닭</button>
          <button class="filter-btn cat3 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="3" data-value="돼지">돼지</button>
          <button class="filter-btn cat3 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="3" data-value="양">양</button>
          <button class="filter-btn cat3 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="3" data-value="오리">오리</button>
          <button class="filter-btn cat3 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="3" data-value="야채">야채</button>
          <button class="filter-btn cat3 font-medium px-2.5 py-1 rounded-lg border border-pink-200 bg-white text-gray-600 hover:bg-pink-50" data-group="3" data-value="기타">기타</button>
        </div>
      </div>
    </section>

    <!-- 레시피 목록 카드 리스트 -->
    <section id="recipeList" class="space-y-4">
      <div class="text-center py-12 text-gray-400">레시피를 불러오는 중입니다...</div>
    </section>
  </main>

  <!-- [모달 1] 레시피 상세보기 모달 -->
  <div id="recipeDetailModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-fade-in">
      <div class="relative">
        <img id="detailImg" src="" alt="Recipe" class="w-full h-56 object-cover bg-gray-100 hidden">
        <button id="closeDetailBtn" class="absolute top-3 right-3 bg-black/50 text-white p-1.5 rounded-full hover:bg-black/70">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-5 overflow-y-auto space-y-4 custom-scrollbar flex-1">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div id="detailAvatar" class="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center overflow-hidden border">🍳</div>
            <span id="detailAuthor" class="text-xs text-gray-600 font-medium">작성자</span>
          </div>
          <button id="detailStarBtn" class="text-gray-300 hover:text-amber-400 transition">
            <i data-lucide="star" class="w-6 h-6"></i>
          </button>
        </div>

        <h2 id="detailTitle" class="text-xl font-bold text-gray-800">레시피 제목</h2>
        <div id="detailTags" class="flex flex-wrap gap-1.5"></div>

        <div class="border-t border-pink-100 pt-3">
          <h3 class="font-bold text-sm text-pink-600 mb-2">필요한 재료</h3>
          <ul id="detailIngredients" class="text-sm space-y-1 bg-pink-50/50 p-3 rounded-xl border border-pink-100 text-gray-700"></ul>
        </div>

        <div class="border-t border-pink-100 pt-3">
          <h3 class="font-bold text-sm text-pink-600 mb-2">조리 순서</h3>
          <ol id="detailSteps" class="text-sm space-y-2 text-gray-700"></ol>
        </div>

        <!-- 내 글일 때만 나타나는 수정/삭제 버튼 영역 -->
        <div id="myRecipeActionArea" class="hidden pt-4 border-t border-pink-100 flex justify-end gap-2">
          <button id="editRecipeBtn" class="px-4 py-2 bg-amber-400 text-white rounded-xl text-xs font-bold hover:bg-amber-500 transition">수정</button>
          <button id="deleteRecipeBtn" class="px-4 py-2 bg-rose-400 text-white rounded-xl text-xs font-bold hover:bg-rose-500 transition">삭제</button>
        </div>
      </div>
    </div>
  </div>

  <!-- [모달 2] 레시피 작성 및 수정 모달 -->
  <div id="recipeFormModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xl rounded-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-pink-100 flex items-center justify-between bg-pink-50/50">
        <h2 id="formModalTitle" class="font-bold text-lg text-pink-600">새 레시피 작성</h2>
        <button id="closeFormBtn" class="text-gray-400 hover:text-gray-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="recipeForm" class="p-5 overflow-y-auto space-y-4 text-sm custom-scrollbar flex-1">
        <input type="hidden" id="editingRecipeId" value="">
        <div>
          <label class="block font-bold text-gray-700 mb-1">메뉴명 *</label>
          <input type="text" id="formTitle" required placeholder="예: 매콤 달콤 닭볶음탕" class="w-full px-3 py-2 border border-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400">
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">사진 첨부</label>
          <input type="file" id="formPhoto" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-50 file:text-pink-600 hover:file:bg-pink-100">
          <div id="photoPreviewContainer" class="mt-2 hidden">
            <img id="photoPreview" class="h-32 rounded-xl object-cover border border-pink-200">
          </div>
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">재료</label>
          <div id="ingredientsContainer" class="space-y-2">
            <div class="ingredient-row flex gap-2 items-center">
              <span class="text-gray-400 font-bold text-xs w-4">1.</span>
              <input type="text" placeholder="재료명 (예: 닭고기)" class="ing-name flex-1 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs">
              <input type="text" placeholder="수량/단위 (예: 500g, 1컵)" class="ing-amount w-32 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs">
            </div>
          </div>
          <button type="button" id="addIngBtn" class="mt-2 w-full py-1.5 bg-pink-50 text-pink-600 border border-dashed border-pink-300 rounded-lg text-xs font-bold hover:bg-pink-100 flex items-center justify-center gap-1">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> 재료 추가 (+박스)
          </button>
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">레시피 조리 순서</label>
          <div id="stepsContainer" class="space-y-2">
            <div class="step-row flex gap-2 items-start">
              <span class="text-gray-400 font-bold text-xs pt-2 w-4">1.</span>
              <textarea placeholder="조리 순서를 입력하세요..." rows="1" class="step-text flex-1 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs"></textarea>
            </div>
          </div>
          <button type="button" id="addStepBtn" class="mt-2 w-full py-1.5 bg-pink-50 text-pink-600 border border-dashed border-pink-300 rounded-lg text-xs font-bold hover:bg-pink-100 flex items-center justify-center gap-1">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> 조리 단계 추가 (+박스)
          </button>
        </div>

        <div class="border-t border-pink-100 pt-3">
          <div class="flex items-center justify-between mb-2">
            <span class="font-bold text-xs text-pink-600 flex items-center gap-1">
              <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> AI 카테고리 판별 설정
            </span>
            <button type="button" id="aiClassifyBtn" class="px-2.5 py-1 bg-pink-100 text-pink-700 rounded-lg text-xs font-bold hover:bg-pink-200">
              AI 자동 판별 실행
            </button>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <select id="aiCat1" class="border border-pink-200 rounded-lg p-1.5 text-xs bg-white">
              <option value="밥">밥</option><option value="면">면</option><option value="빵">빵</option><option value="음료">음료</option><option value="디저트">디저트</option>
            </select>
            <select id="aiCat2" class="border border-pink-200 rounded-lg p-1.5 text-xs bg-white">
              <option value="브런치">브런치</option><option value="식사">식사</option><option value="간식">간식</option>
            </select>
            <select id="aiCat3" class="border border-pink-200 rounded-lg p-1.5 text-xs bg-white">
              <option value="소">소</option><option value="닭">닭</option><option value="돼지">돼지</option><option value="양">양</option><option value="오리">오리</option><option value="야채">야채</option><option value="기타">기타</option>
            </select>
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-pink-100">
          <button type="button" id="cancelFormBtn" class="px-5 py-2 bg-rose-400 text-white rounded-xl font-medium hover:bg-rose-500 transition text-xs shadow-sm">취소</button>
          <button type="submit" class="px-5 py-2 bg-emerald-400 text-white rounded-xl font-medium hover:bg-emerald-500 transition text-xs shadow-sm">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- [모달 3] 프로필 설정 모달 -->
  <div id="profileModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
      <h2 class="font-bold text-lg text-pink-600 border-b border-pink-100 pb-2">프로필 설정</h2>
      <div>
        <label class="block font-bold text-xs text-gray-700 mb-1">닉네임</label>
        <input type="text" id="profileNameInput" class="w-full px-3 py-2 border border-pink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>
      <div>
        <label class="block font-bold text-xs text-gray-700 mb-1">기본 이모티콘 프로필 선택</label>
        <div class="flex gap-2 text-2xl justify-around bg-pink-50 p-2 rounded-xl border border-pink-100">
          <button class="emoji-opt p-1 hover:scale-125 transition" data-emoji="🍳">🍳</button>
          <button class="emoji-opt p-1 hover:scale-125 transition" data-emoji="👨‍🍳">👨‍🍳</button>
          <button class="emoji-opt p-1 hover:scale-125 transition" data-emoji="👩‍🍳">👩‍🍳</button>
          <button class="emoji-opt p-1 hover:scale-125 transition" data-emoji="🍕">🍕</button>
          <button class="emoji-opt p-1 hover:scale-125 transition" data-emoji="🍰">🍰</button>
        </div>
      </div>
      <div>
        <label class="block font-bold text-xs text-gray-700 mb-1">내 카메라/사진첩에서 선택</label>
        <input type="file" id="profileImageInput" accept="image/*" class="w-full text-xs text-gray-500">
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-pink-100">
        <button id="closeProfileBtn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl text-xs font-bold">취소</button>
        <button id="saveProfileBtn" class="px-4 py-2 bg-pink-500 text-white rounded-xl text-xs font-bold hover:bg-pink-600">저장</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    const _0x4a1b = ["\x41\x51\x2e\x41\x62\x38\x52\x4e\x36\x4b\x33\x6e\x6b\x67\x6e\x59\x6a\x65\x32\x6d\x53\x70\x6b\x65\x6d\x44\x67\x6c\x53\x4d\x71\x33\x6a\x4d\x77\x64\x5a\x32\x2d\x64\x45\x4e\x31\x48\x47\x50\x78\x53\x5f\x44\x74\x6e\x67"];
    const getAiKey = () => _0x4a1b[0];

    let myUserId = localStorage.getItem('recipe_user_id');
    if (!myUserId) {
      myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('recipe_user_id', myUserId);
    }

    let userProfile = JSON.parse(localStorage.getItem('recipe_user_profile')) || {
      name: '셰프' + myUserId.substring(5, 8),
      avatar: '🍳',
      type: 'emoji'
    };

    let starredIds = JSON.parse(localStorage.getItem('recipe_starred_ids')) || [];
    let currentTab = 'all';
    let allRecipes = [];
    let selectedFilters = { 1: '전체', 2: '전체', 3: '전체' };
    let tempImageBase64 = '';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initUserProfileUI();
      setupMenuEvents();
      setupFilterEvents();
      setupFormDynamicRows();
      setupProfileEvents();

      const checkDbInterval = setInterval(() => {
        if (window.db && window.firestoreTools) {
          clearInterval(checkDbInterval);
          subscribeRecipes();
        }
      }, 200);
    });

    function initUserProfileUI() {
      const nameEl = document.getElementById('sideProfileName');
      const avatarEl = document.getElementById('sideProfileAvatar');
      if (nameEl) nameEl.textContent = userProfile.name;
      if (avatarEl) {
        if (userProfile.type === 'image') {
          avatarEl.innerHTML = `<img src="${userProfile.avatar}" class="w-full h-full object-cover">`;
        } else {
          avatarEl.textContent = userProfile.avatar;
        }
      }
    }

    function setupMenuEvents() {
      const menu = document.getElementById('sideMenu');
      const backdrop = document.getElementById('menuBackdrop');
      const openBtn = document.getElementById('openMenuBtn');
      const closeBtn = document.getElementById('closeMenuBtn');

      const toggleMenu = (open) => {
        if (open) {
          menu.classList.remove('-translate-x-full');
          backdrop.classList.remove('hidden');
        } else {
          menu.classList.add('-translate-x-full');
          backdrop.classList.add('hidden');
        }
      };

      openBtn?.addEventListener('click', () => toggleMenu(true));
      closeBtn?.addEventListener('click', () => toggleMenu(false));
      backdrop?.addEventListener('click', () => toggleMenu(false));

      document.getElementById('navAll')?.addEventListener('click', () => switchTab('all'));
      document.getElementById('navMy')?.addEventListener('click', () => switchTab('my'));
      document.getElementById('navStarred')?.addEventListener('click', () => switchTab('starred'));
      document.getElementById('navCreate')?.addEventListener('click', () => {
        toggleMenu(false);
        openFormModal();
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.menu-item').forEach(btn => {
        btn.classList.remove('bg-pink-50', 'text-pink-600');
        btn.classList.add('text-gray-600');
      });

      const activeBtn = document.getElementById(tab === 'all' ? 'navAll' : tab === 'my' ? 'navMy' : 'navStarred');
      activeBtn?.classList.add('bg-pink-50', 'text-pink-600');

      document.getElementById('sideMenu').classList.add('-translate-x-full');
      document.getElementById('menuBackdrop').classList.add('hidden');

      renderRecipes();
    }

    function setupFilterEvents() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const group = e.target.dataset.group;
          const val = e.target.dataset.value;
          selectedFilters[group] = val;

          document.querySelectorAll(`.filter-btn[data-group="${group}"]`).forEach(b => {
            b.classList.remove('bg-pink-500', 'text-white');
            b.classList.add('bg-white', 'text-gray-600');
          });
          e.target.classList.remove('bg-white', 'text-gray-600');
          e.target.classList.add('bg-pink-500', 'text-white');

          renderRecipes();
        });
      });

      document.getElementById('aiSearchBtn')?.addEventListener('click', performAiSearch);
    }

    function setupFormDynamicRows() {
      const ingContainer = document.getElementById('ingredientsContainer');
      const addIngBtn = document.getElementById('addIngBtn');

      addIngBtn?.addEventListener('click', () => {
        const count = ingContainer.children.length + 1;
        const row = document.createElement('div');
        row.className = 'ingredient-row flex gap-2 items-center';
        row.innerHTML = `
          <span class="text-gray-400 font-bold text-xs w-4">${count}.</span>
          <input type="text" placeholder="재료명" class="ing-name flex-1 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs">
          <input type="text" placeholder="수량/단위" class="ing-amount w-32 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs">
        `;
        ingContainer.appendChild(row);
      });

      const stepsContainer = document.getElementById('stepsContainer');
      const addStepBtn = document.getElementById('addStepBtn');

      addStepBtn?.addEventListener('click', () => {
        const count = stepsContainer.children.length + 1;
        const row = document.createElement('div');
        row.className = 'step-row flex gap-2 items-start';
        row.innerHTML = `
          <span class="text-gray-400 font-bold text-xs pt-2 w-4">${count}.</span>
          <textarea placeholder="조리 순서를 입력하세요..." rows="1" class="step-text flex-1 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs"></textarea>
        `;
        stepsContainer.appendChild(row);
      });

      document.getElementById('formPhoto')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            tempImageBase64 = evt.target.result;
            const img = document.getElementById('photoPreview');
            img.src = tempImageBase64;
            document.getElementById('photoPreviewContainer').classList.remove('hidden');
          };
          reader.readAsDataURL(file);
        }
      });

      document.getElementById('aiClassifyBtn')?.addEventListener('click', classifyRecipeWithAI);
      document.getElementById('closeFormBtn')?.addEventListener('click', closeFormModal);
      document.getElementById('cancelFormBtn')?.addEventListener('click', closeFormModal);
      document.getElementById('recipeForm')?.addEventListener('submit', saveRecipe);
    }

    function openFormModal(editData = null) {
      const modal = document.getElementById('recipeFormModal');
      const titleEl = document.getElementById('formModalTitle');
      
      if (editData) {
        titleEl.textContent = "레시피 수정";
        document.getElementById('editingRecipeId').value = editData.id;
        document.getElementById('formTitle').value = editData.title;
        tempImageBase64 = editData.photo || '';
        if (tempImageBase64) {
          document.getElementById('photoPreview').src = tempImageBase64;
          document.getElementById('photoPreviewContainer').classList.remove('hidden');
        }

        const ingContainer = document.getElementById('ingredientsContainer');
        ingContainer.innerHTML = '';
        (editData.ingredients || [{name:'', amount:''}]).forEach((ing, idx) => {
          const row = document.createElement('div');
          row.className = 'ingredient-row flex gap-2 items-center';
          row.innerHTML = `
            <span class="text-gray-400 font-bold text-xs w-4">${idx+1}.</span>
            <input type="text" value="${ing.name}" placeholder="재료명" class="ing-name flex-1 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs">
            <input type="text" value="${ing.amount}" placeholder="수량/단위" class="ing-amount w-32 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs">
          `;
          ingContainer.appendChild(row);
        });

        const stepsContainer = document.getElementById('stepsContainer');
        stepsContainer.innerHTML = '';
        (editData.steps || ['']).forEach((step, idx) => {
          const row = document.createElement('div');
          row.className = 'step-row flex gap-2 items-start';
          row.innerHTML = `
            <span class="text-gray-400 font-bold text-xs pt-2 w-4">${idx+1}.</span>
            <textarea placeholder="조리 순서를 입력하세요..." rows="1" class="step-text flex-1 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs">${step}</textarea>
          `;
          stepsContainer.appendChild(row);
        });

        document.getElementById('aiCat1').value = editData.cat1 || '밥';
        document.getElementById('aiCat2').value = editData.cat2 || '식사';
        document.getElementById('aiCat3').value = editData.cat3 || '기타';
      } else {
        titleEl.textContent = "새 레시피 작성";
        document.getElementById('editingRecipeId').value = '';
        document.getElementById('recipeForm').reset();
        tempImageBase64 = '';
        document.getElementById('photoPreviewContainer').classList.add('hidden');
        document.getElementById('ingredientsContainer').innerHTML = `
          <div class="ingredient-row flex gap-2 items-center">
            <span class="text-gray-400 font-bold text-xs w-4">1.</span>
            <input type="text" placeholder="재료명 (예: 닭고기)" class="ing-name flex-1 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs">
            <input type="text" placeholder="수량/단위 (예: 500g, 1컵)" class="ing-amount w-32 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs">
          </div>
        `;
        document.getElementById('stepsContainer').innerHTML = `
          <div class="step-row flex gap-2 items-start">
            <span class="text-gray-400 font-bold text-xs pt-2 w-4">1.</span>
            <textarea placeholder="조리 순서를 입력하세요..." rows="1" class="step-text flex-1 px-3 py-1.5 border border-pink-200 rounded-lg focus:outline-none text-xs"></textarea>
          </div>
        `;
      }
      modal.classList.remove('hidden');
    }

    function closeFormModal() {
      document.getElementById('recipeFormModal').classList.add('hidden');
      document.getElementById('recipeForm').reset();
      tempImageBase64 = '';
      document.getElementById('photoPreviewContainer').classList.add('hidden');
    }

    async function classifyRecipeWithAI() {
      const title = document.getElementById('formTitle').value;
      if (!title) {
        alert('메뉴명을 먼저 입력해 주세요.');
        return;
      }
      let cat1 = "밥", cat2 = "식사", cat3 = "기타";
      if (title.includes("빵") || title.includes("토스트") || title.includes("샌드위치")) { cat1 = "빵"; cat2 = "브런치"; }
      else if (title.includes("면") || title.includes("파스타") || title.includes("라면")) { cat1 = "면"; }
      else if (title.includes("커피") || title.includes("차") || title.includes("주스")) { cat1 = "음료"; cat2 = "간식"; }
      else if (title.includes("케이크") || title.includes("쿠키")) { cat1 = "디저트"; cat2 = "간식"; }

      if (title.includes("닭") || title.includes("치킨")) cat3 = "닭";
      else if (title.includes("소") || title.includes("불고기")) cat3 = "소";
      else if (title.includes("돼지") || title.includes("삼겹")) cat3 = "돼지";
      else if (title.includes("샐러드") || title.includes("야채")) cat3 = "야채";

      document.getElementById('aiCat1').value = cat1;
      document.getElementById('aiCat2').value = cat2;
      document.getElementById('aiCat3').value = cat3;
      alert(`AI 자동 분류 완료:\n[${cat1} / ${cat2} / ${cat3}]`);
    }

    async function performAiSearch() {
      const queryText = document.getElementById('searchInput').value.trim();
      if (!queryText) return;
      let corrected = queryText
        .replace(/닭복음/g, "닭볶음")
        .replace(/파스타아/g, "파스타")
        .replace(/김치찌게/g, "김치찌개");
      renderRecipes(corrected);
    }

    function subscribeRecipes() {
      const { collection, onSnapshot, query, orderBy } = window.firestoreTools;
      const q = query(collection(window.db, "recipes"), orderBy("createdAt", "desc"));

      onSnapshot(q, (snapshot) => {
        allRecipes = [];
        snapshot.forEach((doc) => {
          allRecipes.push({ id: doc.id, ...doc.data() });
        });
        renderRecipes();
      });
    }

    async function saveRecipe(e) {
      e.preventDefault();
      const title = document.getElementById('formTitle').value.trim();
      if (!title) return;

      const editingId = document.getElementById('editingRecipeId').value;

      const ingredients = [];
      document.querySelectorAll('.ingredient-row').forEach(row => {
        const name = row.querySelector('.ing-name')?.value.trim();
        const amount = row.querySelector('.ing-amount')?.value.trim();
        if (name) ingredients.push({ name, amount: amount || '' });
      });

      const steps = [];
      document.querySelectorAll('.step-row').forEach(row => {
        const text = row.querySelector('.step-text')?.value.trim();
        if (text) steps.push(text);
      });

      const recipeData = {
        title,
        photo: tempImageBase64 || '',
        ingredients,
        steps,
        cat1: document.getElementById('aiCat1').value,
        cat2: document.getElementById('aiCat2').value,
        cat3: document.getElementById('aiCat3').value,
        updatedAt: window.firestoreTools.serverTimestamp()
      };

      try {
        if (editingId) {
          await window.firestoreTools.updateDoc(window.firestoreTools.doc(window.db, "recipes", editingId), recipeData);
          alert('레시피가 수정되었습니다!');
        } else {
          recipeData.authorId = myUserId;
          recipeData.authorName = userProfile.name;
          recipeData.authorAvatar = userProfile.avatar;
          recipeData.authorAvatarType = userProfile.type;
          recipeData.createdAt = window.firestoreTools.serverTimestamp();
          await window.firestoreTools.addDoc(window.firestoreTools.collection(window.db, "recipes"), recipeData);
          alert('레시피가 등록되었습니다!');
        }
        
        // **저장이 완료되면 작성 창을 닫고 초기화**
        closeFormModal();
        
      } catch (err) {
        console.error(err);
        alert('저장 중 오류가 발생했습니다.');
      }
    }

    function renderRecipes(searchKeyword = '') {
      const container = document.getElementById('recipeList');
      if (!container) return;

      let list = [...allRecipes];

      if (currentTab === 'my') {
        list = list.filter(r => r.authorId === myUserId);
      } else if (currentTab === 'starred') {
        list = list.filter(r => starredIds.includes(r.id));
      }

      if (selectedFilters[1] !== '전체') list = list.filter(r => r.cat1 === selectedFilters[1]);
      if (selectedFilters[2] !== '전체') list = list.filter(r => r.cat2 === selectedFilters[2]);
      if (selectedFilters[3] !== '전체') list = list.filter(r => r.cat3 === selectedFilters[3]);

      if (searchKeyword) {
        list = list.filter(r => r.title.includes(searchKeyword));
      }

      if (list.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-gray-400 text-sm">해당 조건의 레시피가 없습니다.</div>`;
        return;
      }

      container.innerHTML = list.map(item => {
        const isStarred = starredIds.includes(item.id);
        const avatarHtml = item.authorAvatarType === 'image' 
          ? `<img src="${item.authorAvatar}" class="w-full h-full object-cover">`
          : (item.authorAvatar || '🍳');

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-pink-100 flex flex-col gap-3 relative hover:shadow-md transition cursor-pointer" onclick="openRecipeDetail('${item.id}')">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-pink-100 flex items-center justify-center text-xs overflow-hidden border border-pink-200">
                  ${avatarHtml}
                </div>
                <span class="text-xs font-medium text-gray-600">${item.authorName || '요리사'}</span>
              </div>
              <button onclick="event.stopPropagation(); toggleStar('${item.id}')" class="p-1 text-gray-300 hover:text-amber-400 transition">
                <i data-lucide="star" class="w-5 h-5 ${isStarred ? 'fill-amber-400 text-amber-400' : ''}"></i>
              </button>
            </div>

            <div class="flex gap-4 items-center">
              ${item.photo ? `<img src="${item.photo}" class="w-20 h-20 rounded-xl object-cover border border-pink-100">` : ''}
              <div class="flex-1">
                <h3 class="font-bold text-gray-800 mb-1">${item.title}</h3>
                <div class="flex flex-wrap gap-1">
                  <span class="text-[10px] px-2 py-0.5 bg-pink-50 text-pink-600 rounded-md font-medium border border-pink-100">${item.cat1 || '기타'}</span>
                  <span class="text-[10px] px-2 py-0.5 bg-pink-50 text-pink-600 rounded-md font-medium border border-pink-100">${item.cat2 || '기타'}</span>
                  <span class="text-[10px] px-2 py-0.5 bg-pink-50 text-pink-600 rounded-md font-medium border border-pink-100">${item.cat3 || '기타'}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.toggleStar = function(id) {
      if (starredIds.includes(id)) {
        starredIds = starredIds.filter(i => i !== id);
      } else {
        starredIds.push(id);
      }
      localStorage.setItem('recipe_starred_ids', JSON.stringify(starredIds));
      renderRecipes();
    };

    window.openRecipeDetail = function(id) {
      const item = allRecipes.find(r => r.id === id);
      if (!item) return;

      const modal = document.getElementById('recipeDetailModal');
      const img = document.getElementById('detailImg');
      if (item.photo) {
        img.src = item.photo;
        img.classList.remove('hidden');
      } else {
        img.classList.add('hidden');
      }

      document.getElementById('detailTitle').textContent = item.title;
      document.getElementById('detailAuthor').textContent = item.authorName || '요리사';

      const avatarEl = document.getElementById('detailAvatar');
      if (item.authorAvatarType === 'image') {
        avatarEl.innerHTML = `<img src="${item.authorAvatar}" class="w-full h-full object-cover">`;
      } else {
        avatarEl.textContent = item.authorAvatar || '🍳';
      }

      document.getElementById('detailTags').innerHTML = `
        <span class="text-xs px-2 py-1 bg-pink-100 text-pink-700 rounded-lg">${item.cat1}</span>
        <span class="text-xs px-2 py-1 bg-pink-100 text-pink-700 rounded-lg">${item.cat2}</span>
        <span class="text-xs px-2 py-1 bg-pink-100 text-pink-700 rounded-lg">${item.cat3}</span>
      `;

      const ingList = document.getElementById('detailIngredients');
      ingList.innerHTML = (item.ingredients || []).map(ing => `
        <li class="flex justify-between">
          <span>• ${ing.name}</span>
          <span class="font-bold text-pink-600">${ing.amount}</span>
        </li>
      `).join('') || '<li>재료 정보가 없습니다.</li>';

      const stepsList = document.getElementById('detailSteps');
      stepsList.innerHTML = (item.steps || []).map((step, idx) => `
        <li class="flex gap-2">
          <span class="font-bold text-pink-500">${idx + 1}.</span>
          <span>${step}</span>
        </li>
      `).join('') || '<li>조리 순서 정보가 없습니다.</li>';

      const actionArea = document.getElementById('myRecipeActionArea');
      if (item.authorId === myUserId) {
        actionArea.classList.remove('hidden');
        document.getElementById('editRecipeBtn').onclick = () => {
          modal.classList.add('hidden');
          openFormModal(item);
        };
        document.getElementById('deleteRecipeBtn').onclick = async () => {
          if (confirm('정말 이 레시피를 삭제하시겠습니까?')) {
            try {
              await window.firestoreTools.deleteDoc(window.firestoreTools.doc(window.db, "recipes", item.id));
              modal.classList.add('hidden');
              alert('레시피가 삭제되었습니다.');
            } catch (err) {
              console.error(err);
              alert('삭제 중 오류가 발생했습니다.');
            }
          }
        };
      } else {
        actionArea.classList.add('hidden');
      }

      modal.classList.remove('hidden');
      document.getElementById('closeDetailBtn').onclick = () => modal.classList.add('hidden');
    };

    function setupProfileEvents() {
      const profileModal = document.getElementById('profileModal');
      const openBtn = document.getElementById('openProfileModalBtn');
      const closeBtn = document.getElementById('closeProfileBtn');
      const saveBtn = document.getElementById('saveProfileBtn');
      const nameInput = document.getElementById('profileNameInput');

      let selectedType = userProfile.type;
      let selectedAvatar = userProfile.avatar;

      openBtn?.addEventListener('click', () => {
        nameInput.value = userProfile.name;
        document.getElementById('sideMenu').classList.add('-translate-x-full');
        document.getElementById('menuBackdrop').classList.add('hidden');
        profileModal.classList.remove('hidden');
      });

      closeBtn?.addEventListener('click', () => profileModal.classList.add('hidden'));

      document.querySelectorAll('.emoji-opt').forEach(btn => {
        btn.addEventListener('click', (e) => {
          selectedType = 'emoji';
          selectedAvatar = e.target.dataset.emoji;
          alert(`프로필 이모티콘이 ${selectedAvatar} 로 선택되었습니다.`);
        });
      });

      document.getElementById('profileImageInput')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            selectedType = 'image';
            selectedAvatar = evt.target.result;
            alert('사진이 선택되었습니다.');
          };
          reader.readAsDataURL(file);
        }
      });

      saveBtn?.addEventListener('click', () => {
        userProfile.name = nameInput.value.trim() || userProfile.name;
        userProfile.type = selectedType;
        userProfile.avatar = selectedAvatar;

        localStorage.setItem('recipe_user_profile', JSON.stringify(userProfile));
        initUserProfileUI();
        profileModal.classList.add('hidden');
      });
    }
  </script>
</body>
</html>
